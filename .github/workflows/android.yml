
name: Build ASHVAULT Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Prepare Android export
        shell: bash
        run: |
          mkdir -p ~/.config ~/.local/share/godot/export_templates build
          cp -a /root/.config/godot ~/.config/ 2>/dev/null || true
          cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ 2>/dev/null || true

          cat > export_presets.cfg <<'PRESET'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ashvault.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk=""
          gradle_build/target_sdk=""
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.sarvakala.ashvault"
          package/name="ASHVAULT"
          package/signed=true
          PRESET

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/ashvault.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASHVAULT-Android-APK
          path: build/ashvault.apk
          
